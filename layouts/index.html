{{ define "main" }}
{{ partial "profile.html" . }}
<div class="home-overview">
<section class="home-section" id="posts" aria-labelledby="posts-heading">
  <h2 id="posts-heading">Posts</h2>
  {{ partial "entries.html" (dict "pages" (partial "posts.html" .) "empty" "No posts published yet.") }}
</section>
<section class="home-section" id="updates" aria-labelledby="updates-heading">
  <h2 id="updates-heading">Updates</h2>
  {{ $updates := (where site.RegularPages "Section" "updates").ByDate.Reverse }}
  {{ partial "updates.html" $updates }}
</section>
</div>
{{ end }}
