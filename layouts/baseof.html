<!doctype html>
<html lang="{{ site.Language.Locale | default "en" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ .Description | default .Summary | default site.Params.description | plainify }}">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
  {{ if .IsPage }}<script src="{{ "js/toc.js" | relURL }}" defer></script>{{ end }}
  {{ with .OutputFormats.Get "rss" }}<link rel="alternate" type="application/rss+xml" title="{{ site.Title }}" href="{{ .RelPermalink }}">{{ end }}
</head>
<body{{ if .IsHome }} class="home"{{ end }}>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="site-shell">
    <main id="main">{{ block "main" . }}{{ end }}</main>
    <footer class="site-footer"><a href="{{ "index.xml" | relURL }}">RSS</a>{{ if not .IsHome }}<a href="{{ site.Home.RelPermalink }}">Back to home</a>{{ end }}</footer>
  </div>
</body>
</html>
